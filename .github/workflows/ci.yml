name: CI

# Every lane compiles AND executes the tests. A lane that only type-checks has
# not tested anything, so there is no check-only job here.
#
# The compiler comes from the published release, pinned in FINC_VERSION, and
# installed by .github/scripts/install_finc.py, which verifies the index's
# sha256 and refuses a compiler that cannot answer --version. Windows supports
# this source through `#c_ifdef FIN_TARGET_WINDOWS`, and the windows-x86_64
# lane is where that branch is actually executed.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-15
          - name: macos-x86_64
            runner: macos-15-intel
          - name: windows-x86_64
            runner: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The published Linux artifact for ARM64 exists only as a dynamically
      # linked build that needs libLLVM.so.22.1, and the macOS artifacts link a
      # Homebrew libLLVM.dylib. The runtime must exist before the installer runs
      # its own `finc --version` check, or a usable compiler looks broken.
      - name: Install Linux LLVM runtime
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/llvm-archive-keyring.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' \
            | sudo tee /etc/apt/sources.list.d/llvm22.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-22 clang-22

      - name: Install macOS LLVM runtime
        if: runner.os == 'macOS'
        run: brew install llvm@22

      - name: Install Windows linker toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # install_finc.py ends by printing `::add-path::`, a workflow command
      # GitHub has disabled; the runner turns it into a step failure. The
      # compiler is invoked by explicit path here, so the line is filtered
      # rather than suppressed with ACTIONS_ALLOW_UNSECURE_COMMANDS.
      - name: Install pinned finc
        run: |
          set -euo pipefail
          python3 -I .github/scripts/install_finc.py --dest .finc > install_finc.log 2>&1 || {
            cat install_finc.log
            exit 1
          }
          grep -v '^::add-path::' install_finc.log

      - name: Show compiler identity, require contract 3
        run: |
          set -euo pipefail
          got=$(.finc/bin/finc --version)
          echo "$got"
          case "$got" in
            *"contract 3"*) ;;
            *) echo "finc does not speak contract 3: $got"; exit 1 ;;
          esac

      # A frontend-only check first: it separates a parse/type failure from a
      # codegen or link failure in the log.
      - name: Frontend check
        run: .finc/bin/finc src/crypto.fin

      - name: Build and execute all tests (-O0 and -O2)
        run: python3 -I tests/run_tests.py --finc .finc/bin/finc

      - name: Build and execute the example
        run: |
          set -euo pipefail
          .finc/bin/finc examples/basic.fin -I src -o example_basic
          ./example_basic

      # finn is the real package manager; exercising it catches a manifest the
      # tool cannot consume. It is best-effort because finn is installed from
      # source and its build time is not this repository's cost to pay.
      - name: Package manager check (finn)
        continue-on-error: true
        run: |
          set -euo pipefail
          export FIN_COMPILER_PATH="$PWD/.finc/bin/finc"
          if ! command -v finn >/dev/null 2>&1; then
            echo "finn not installed on this runner; skipping package check"
            exit 0
          fi
          finn healthcheck
          finn test
